<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>転生∞ - Re:World</title><link rel="manifest" href="/reward/manifest.json"><meta name="theme-color" content="#080b18"><link rel="apple-touch-icon" href="/reward/icon-192.png"><style>
:root{--b:#080b18;--p:#11162a;--l:#293252;--t:#edf2ff;--a:#6d5dfc;--r:#ff5d73;--g:#57df9b;--u:#55b8ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#171942,var(--b) 45%);color:var(--t);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;padding-bottom:86px;min-height:100dvh}header{padding:13px 15px;background:#090d1ddd;border-bottom:1px solid var(--l);position:sticky;top:0;z-index:5}h1{font-size:19px;margin:0}main{max-width:600px;margin:auto;padding:9px;display:grid;gap:9px}.c{background:#11162add;border:1px solid var(--l);border-radius:14px;padding:11px}.sg,.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.sg{grid-template-columns:repeat(4,1fr)}.s,.item{background:#0b1020;border-radius:9px;padding:7px;text-align:center;font-size:11px}.s b{font-size:17px;display:block}.bar{height:11px;background:#252b42;border-radius:99px;overflow:hidden;margin:4px 0 8px}.bar i{display:block;height:100%}.hp{background:var(--r)}.mp{background:var(--u)}.xp{background:var(--g)}button{border:1px solid #3c4670;background:#1b2341;color:white;border-radius:10px;padding:10px;font-weight:700}.pri{background:#493cc5}.enemy{text-align:center}.ico{font-size:48px}#log{height:120px;overflow:auto;background:#070b16;padding:8px;border-radius:9px;font-size:12px}nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#090d1df5;border-top:1px solid var(--l);display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:5px 5px calc(5px + env(safe-area-inset-bottom))}nav button{padding:7px 1px;font-size:10px}.ov{position:fixed;inset:0;background:#050713f2;z-index:30;display:flex;align-items:center;justify-content:center;padding:15px}.modal{width:min(540px,100%);max-height:90dvh;overflow:auto;background:var(--p);border:1px solid #46517e;border-radius:17px;padding:15px}.hide{display:none}.choice{width:100%;text-align:left;margin:4px 0}.tag{font-size:10px;background:#273055;border-radius:99px;padding:2px 6px}.float{position:fixed;z-index:50;left:48%;top:40%;font-size:24px;font-weight:900;animation:f 1s forwards}@keyframes f{to{transform:translateY(-65px);opacity:0}}@keyframes shake{50%{transform:translateX(5px)}}.shake{animation:shake .18s 2}
</style></head><body><header><h1>∞ 転生∞ - Re:World</h1><small>ダンジョン転生RPG</small></header><main><section class=c><div id=hero></div><div id=stats></div><div id=bars></div></section><section class="c enemy"><h3>⚔️ 戦闘</h3><div id=enemy></div><div id=combat class=grid></div></section><section class=c id=tab></section><section class=c><b>📜 ログ</b><div id=log></div></section></main><nav><button onclick="show('adv')">🗺️<br>冒険</button><button onclick="show('skill')">✨<br>技</button><button onclick="show('eq')">🗡️<br>装備</button><button onclick="show('quest')">📜<br>依頼</button><button onclick="show('re')">🔄<br>転生</button><button onclick="show('inn')">🏨<br>宿</button></nav><div id=overlay class="ov hide"></div><script>
const KEY="reworldSaveV4";
const jobs={"剣士":{i:"⚔️",hp:130,mp:35,a:16,d:5,x:"高HP・高攻撃の近接職"},"魔術使い":{i:"🧙",hp:85,mp:95,a:11,d:2,x:"強力な魔法と合わせ技"},"僧侶":{i:"⛪",hp:110,mp:75,a:9,d:6,x:"回復と耐久が得意"},"盗賊":{i:"🥷",hp:95,mp:45,a:13,d:3,x:"会心・宝箱発見率が高い"}};
const mobs=[["スライム","🟢",45,7,18,12,"炎"],["ゴブリン","👺",75,10,30,22,"雷"],["炎狼","🐺",110,14,45,35,"氷"],["オーガ","👹",165,18,65,50,"毒"],["黒騎士","♞",230,23,90,75,"光"]];
const bosses=[["迷宮の番人","🗿",380,25,180,180,"雷","3ターンごとに防御"],["古龍","🐉",620,32,300,300,"氷","HP半分で狂暴化"],["魔王","😈",950,42,500,500,"光","呪毒を使用"]];
const gear=[["鉄の剣","weapon",4,0,"N"],["魔力の杖","weapon",7,0,"R"],["旅人の鎧","armor",0,4,"N"],["黒騎士の剣","weapon",13,1,"SR"],["竜鱗の鎧","armor",0,12,"SR"],["時空の指輪","acc",7,5,"SSR"]];
const skills=[["強撃","剣士",2,5,1.7,""],["ファイア","魔術使い",2,8,1.6,"炎"],["雷撃","魔術使い",5,12,2,"雷"],["ヒール","僧侶",2,10,0,"回復"],["毒刃","盗賊",2,6,1.4,"毒"],["メテオ","魔術使い",12,30,3.4,"炎"],["時間停止","魔術使い",18,35,.4,"停止"],["空間断裂","魔術使い",25,45,4.5,"時空"]];
const fresh=()=>({job:null,lv:1,xp:0,next:70,hp:100,mhp:100,mp:50,mmp:50,a:10,d:3,gold:50,kills:0,reb:0,rp:0,floor:1,dun:0,bk:0,ch:0,inv:[],eq:{weapon:null,armor:null,acc:null},q:{kill:false,chest:false,boss:false},status:null,last:null});
let S=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||"{}")),E=null,tab="adv",turn=0;
const $=x=>document.getElementById(x),save=()=>localStorage.setItem(KEY,JSON.stringify(S));
function log(x){$("log").innerHTML=x+"<br>"+$("log").innerHTML}function pop(x){let d=document.createElement("div");d.className="float";d.textContent=x;document.body.append(d);setTimeout(()=>d.remove(),1000)}
function A(){return S.a+(S.eq.weapon?.[2]||0)+(S.eq.armor?.[2]||0)+(S.eq.acc?.[2]||0)+Math.floor(S.rp/2)}function D(){return S.d+(S.eq.weapon?.[3]||0)+(S.eq.armor?.[3]||0)+(S.eq.acc?.[3]||0)+Math.floor(S.rp/3)}
function pickJob(){let o=$("overlay");o.classList.remove("hide");o.innerHTML=`<div class=modal><h2>🌟 職業選択</h2><p>最初の役職を選んでください。</p>${Object.entries(jobs).map(([n,j])=>`<button class=choice onclick="setJob('${n}')"><b>${j.i} ${n}</b><br><small>${j.x}</small></button>`).join("")}</div>`}
function setJob(n){let j=jobs[n];S.job=n;S.mhp=j.hp;S.hp=j.hp;S.mmp=j.mp;S.mp=j.mp;S.a=j.a;S.d=j.d;save();$("overlay").classList.add("hide");spawn();log(`🌟 ${n}として冒険開始！`)}
function mk(x,b=false){return{name:x[0],i:x[1],hp:x[2],mhp:x[2],a:x[3],xp:x[4],g:x[5],weak:x[6],boss:b,gim:x[7]||"",poison:0,stop:0}}
function spawn(b=false){let x=b?bosses[Math.min(S.dun,bosses.length-1)]:mobs[Math.min(mobs.length-1,Math.floor((S.floor-1)/2))];E=mk(x,b);let k=1+S.reb*.12+S.floor*.04;E.hp=E.mhp=Math.floor(E.hp*k);turn=0;render()}
function hit(mult=1,name="⚔️ 攻撃",st=""){if(!E)return;turn++;let crit=Math.random()<(S.job==="盗賊"?.22:.1),d=Math.max(1,Math.floor(A()*mult*(.85+Math.random()*.3)*(crit?1.8:1)));if(st&&E.weak===st)d=Math.floor(d*1.5);E.hp-=d;pop((crit?"💥":"")+"-"+d);log(`${name} ${d}ダメージ${crit?"【会心】":""}`);if(st==="毒")E.poison=3;if(st==="停止")E.stop=1;if(E.hp<=0)return win();enemyTurn();render()}
function skill(i){let s=skills[i];if(s[1]!==S.job||S.lv<s[2])return log("🔒 未習得");if(S.mp<s[3])return log("MP不足");S.mp-=s[3];if(s[5]==="回復"){S.hp=Math.min(S.mhp,S.hp+50);log("💚 ヒール！");enemyTurn();return render()}if(S.last==="時間停止"&&s[0]==="メテオ"){S.last=null;log("🌌 合わせ技【時空メテオ】！");return hit(6.5,"🌌 時空メテオ","時空")}S.last=s[0];hit(s[4],"✨ "+s[0],s[5])}
function enemyTurn(){if(E.stop){E.stop--;return log("⏱️ 敵は時間停止中")}let m=E.name==="古龍"&&E.hp<E.mhp/2?1.45:1,d=Math.max(1,Math.floor(E.a*m-D()*.55+Math.random()*5));S.hp-=d;document.body.classList.add("shake");setTimeout(()=>document.body.classList.remove("shake"),400);log(`${E.i} ${E.name}の攻撃 ${d}ダメージ`);if(E.poison){E.hp-=8;E.poison--;log("☠️ 毒ダメージ")}if(E.name==="魔王"&&Math.random()<.2){S.status="毒";log("☠️ 呪毒を受けた")}if(S.status==="毒")S.hp-=4;if(S.hp<=0){S.hp=Math.ceil(S.mhp/2);S.mp=Math.ceil(S.mmp/2);S.gold=Math.max(0,S.gold-20);S.status=null;log("💀 敗北。宿屋へ…");spawn()}}
function win(){S.kills++;S.gold+=E.g;S.xp+=E.xp;log(`🏆 ${E.name}撃破 +${E.xp}EXP +${E.g}G`);if(E.boss){S.bk++;S.dun++;drop(true)}else if(Math.random()<.2)drop(false);if(Math.random()<(S.job==="盗賊"?.32:.18))chest();if(Math.random()<.22)event();while(S.xp>=S.next){S.xp-=S.next;S.lv++;S.next=Math.floor(S.next*1.25);S.mhp+=8;S.mmp+=4;S.a+=2;S.d++;S.hp=S.mhp;S.mp=S.mmp;log(`⬆️ Lv.${S.lv}！`)}S.floor++;quest();save();spawn(S.floor%6===0)}
function drop(b){let pool=b?gear.slice(3):gear.slice(0,3),g=pool[Math.floor(Math.random()*pool.length)];S.inv.push(g);log(`🎁 装備ドロップ【${g[4]}】${g[0]}`)}
function chest(){S.ch++;let g=30+Math.floor(Math.random()*91);S.gold+=g;log(`🧰 宝箱！ ${g}G`);quest()}function event(){let r=Math.random();if(r<.33){S.hp=Math.min(S.mhp,S.hp+40);log("⛲ 癒しの泉 HP回復")}else if(r<.66){S.gold+=80;log("🧚 妖精から80G")}else{S.hp=Math.max(1,S.hp-20);log("🪤 罠！ HP-20")}}
function quest(){if(S.kills>=10)S.q.kill=true;if(S.ch>=3)S.q.chest=true;if(S.bk>=1)S.q.boss=true}
function equip(i){let g=S.inv[i];S.eq[g[1]]=g;save();render();log(`🗡️ ${g[0]}を装備`)}function inn(){S.hp=S.mhp;S.mp=S.mmp;S.status=null;save();render();log("🏨 完全回復。0G")}
function reinc(){if(S.lv<20)return log("🔒 Lv.20以上必要");let o=$("overlay");o.classList.remove("hide");o.innerHTML=`<div class=modal><h2>🔄 転生3択</h2><button class=choice onclick="doRe('a')">🔥 武神：攻撃を恒久強化</button><button class=choice onclick="doRe('d')">🛡️ 守護神：HP・防御を恒久強化</button><button class=choice onclick="doRe('m')">🔮 賢者：MPを恒久強化</button><button onclick="closeO()">やめる</button></div>`}
function doRe(t){let keep={job:S.job,reb:S.reb+1,rp:S.rp+Math.floor(S.lv/5)+1,inv:S.inv,eq:S.eq,bk:S.bk,ch:S.ch,q:S.q};S=fresh();Object.assign(S,keep);let j=jobs[S.job];S.mhp=j.hp;S.hp=j.hp;S.mmp=j.mp;S.mp=j.mp;S.a=j.a;S.d=j.d;if(t==="a")S.a+=S.reb*2;if(t==="d"){S.mhp+=S.reb*10;S.hp=S.mhp;S.d+=S.reb}if(t==="m"){S.mmp+=S.reb*8;S.mp=S.mmp}closeO();save();spawn();log(`✨ 転生${S.reb}回目！`)}function closeO(){$("overlay").classList.add("hide")}function show(t){tab=t;render()}
function render(){if(!S.job)return pickJob();$("hero").innerHTML=`<b>${jobs[S.job].i} ${S.job}</b> Lv.${S.lv}　<span style="color:#ffd166">転生${S.reb}回 / RP ${S.rp}</span>`;$("stats").innerHTML=`<div class=sg><div class=s><b>${A()}</b>攻撃</div><div class=s><b>${D()}</b>防御</div><div class=s><b>${S.gold}</b>G</div><div class=s><b>${S.kills}</b>討伐</div></div>`;$("bars").innerHTML=`HP ${Math.max(0,S.hp)}/${S.mhp}<div class=bar><i class=hp style="width:${100*S.hp/S.mhp}%"></i></div>MP ${S.mp}/${S.mmp}<div class=bar><i class=mp style="width:${100*S.mp/S.mmp}%"></i></div>EXP ${S.xp}/${S.next}<div class=bar><i class=xp style="width:${100*S.xp/S.next}%"></i></div>${S.status?`<span class=tag>状態異常:${S.status}</span>`:""}`;if(E){$("enemy").innerHTML=`<div class=ico>${E.i}</div><b>${E.boss?"👑 BOSS ":""}${E.name}</b><br><small>弱点:${E.weak} ${E.gim}</small><div class=bar><i class=hp style="width:${Math.max(0,100*E.hp/E.mhp)}%"></i></div>${Math.max(0,E.hp)}/${E.mhp}`;$("combat").innerHTML=`<button class=pri onclick="hit()">⚔️ 攻撃</button><button onclick="enemyTurn();render()">🛡️ 防御</button>`}let T="";if(tab==="adv")T=`<h3>🗺️ ダンジョン</h3><p>第${S.dun+1}迷宮・${S.floor}階。6階ごとにボス出現。</p><button onclick="spawn(true)">👑 ボスに挑戦</button>`;if(tab==="skill")T=`<h3>✨ 技・合わせ技</h3><div class=grid>${skills.map((s,i)=>`<button onclick="skill(${i})" ${s[1]!==S.job||S.lv<s[2]?"disabled":""}>${s[0]}<br><small>${s[1]} Lv.${s[2]} / ${s[3]}MP</small></button>`).join("")}</div><p>時間停止 → メテオ = <b>時空メテオ</b></p>`;if(tab==="eq")T=`<h3>🗡️ 装備</h3>${S.inv.length?S.inv.map((g,i)=>`<div class=item>【${g[4]}】${g[0]} 攻+${g[2]} 防+${g[3]} <button onclick="equip(${i})">装備</button></div>`).join(""):"未所持"}`;if(tab==="quest")T=`<h3>📜 クエスト</h3><p>${S.q.kill?"✅":"⬜"} 敵10体 ${S.kills}/10</p><p>${S.q.chest?"✅":"⬜"} 宝箱3個 ${S.ch}/3</p><p>${S.q.boss?"✅":"⬜"} ボス1体 ${S.bk}/1</p>`;if(tab==="re")T=`<h3>🔄 転生</h3><p>Lv.20で転生可能。転生時に3つの加護から1つ選択。</p><button class=pri onclick="reinc()">転生する</button>`;if(tab==="inn")T=`<h3>🏨 宿屋</h3><p>HP・MP・状態異常を無料で回復。</p><button onclick="inn()">休む（0G）</button>`;$("tab").innerHTML=T;save()}
if("serviceWorker"in navigator)navigator.serviceWorker.register("/reward/sw.js");if(!S.job)pickJob();else spawn();log("🌟 Re:World 新章が始まった。");
</script></body></html>
